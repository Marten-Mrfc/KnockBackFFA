# ###############################
#                              #
#           Settings           #
#                              #
# ###############################

language: "en" # Language for the plugin.
mapDuration: 60 # Duration between map changes in seconds.
kit-cooldown: 30 # The duration of the kit cooldown in seconds.
allowDropping: false # Allow players to drop items
allowPickUp: false # Allow players to pick up items
allowCrafting: true # Allow players to craft items
allowBlockBreaking: false # Allow players to break blocks
allowDamage: false # Allow players to damage each other
bossbar: # Enable or disable the bossbar
  enabled: true
scoreboard: # Enable or disable the scoreboard
  enabled: true
debug: false # Enable or disable debug messages

# ###############################
#                              #
#        File System(Beta)     #
#                              #
# ###############################

storage:
  type: file # Options: file, MySQL
  mysql:
    host: localhost # MySQL host(IP)
    port: 3306 # MySQL port
    database: knockbackffa # The database name
    user: root # Username for MySQL
    password: "" # MySQL password

# ###############################
#                              #
#         DO NOT EDIT!         #
#                              #
# ###############################

config-version: 1.0.0 # MLib version - Do Not Change
currentArena: "" # Current arena name

# ###############################
#                              #
#        Combat System         #
#                              #
# ###############################

combat:
  # Time in seconds after death to track recent kills for revenge detection
  revenge-timeout: 30

  # Time in seconds before combat sessions expire (no more damage tracking)
  session-timeout: 10

  # Minimum damage percentage required to get an assist (5% = 0.05 coins minimum)
  min-assist-percentage: 5.0
# ###############################
#                              #
#         Kill Rewards         #
#                              #
# ###############################

# Kill types and their coin rewards (configured in code):
# - NORMAL: 1 coin
# - AERIAL: 5 coins (when killer is airborne)
# - UNDERDOG: 2 coins (when victim has higher K/D than killer)
# - REVENGE: 2 coins (when killer was recently killed by victim)
#
# Assists are calculated as percentage of total damage:
# - 10% damage = 0.1 coins
# - 50% damage = 0.5 coins
# - 90% damage = 0.9 coins
# - 100% damage = kill reward (not assist)
